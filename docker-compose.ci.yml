---
version: "3.9"
services:
  backend:
    image: eu.gcr.io/akvo-lumen/akvo-mis/backend:latest-test
    command: ["sh", "run.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=akvo-mis
      - APP_SHORT_NAME=akvo-mis
      - APK_SHORT_NAME=mis-mobile
      - APK_NAME=mis-mobile
      - SHOW_LANDING_PAGE=false
      - DB_SCHEMA=mis
      - DB_USER=akvo
      - DB_PASSWORD=password
      - DB_HOST=db
      - DJANGO_SECRET=ci-secret
      - DEBUG=True
      - MAILJET_APIKEY=$MAILJET_APIKEY
      - MAILJET_SECRET=$MAILJET_SECRET
      - WEBDOMAIN=notset
      - APK_UPLOAD_SECRET=ci-secret
      - SENTRY_DSN
    network_mode: service:mainnetwork
    restart: always
    volumes:
      - ./backend:/app:delegated
      - ${SERVICE_ACCOUNT}:/credentials/:ro
    working_dir: /app
  ci:
    image: alpine:3.14
    depends_on:
      - backend
      - db
      - frontend
    entrypoint: ./entrypoint.sh
    network_mode: service:mainnetwork
    volumes:
      - ./ci/test:/test:ro
    working_dir: /test
  db:
    image: postgres:12-alpine
    command:
      postgres -c 'shared_buffers=128MB' -c 'fsync=off' -c 'synchronous_commit=off'
      -c 'full_page_writes=off' -c 'max_connections=100' -c 'bgwriter_lru_maxpages=0'
      -c 'client_min_messages=warning'
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432
    restart: always
    volumes:
      - ./db/docker-entrypoint-initdb.d/000-init.sql:/docker-entrypoint-initdb.d/000-init.sql
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    image: eu.gcr.io/akvo-lumen/akvo-mis/frontend:latest-test
    # In CI all services share one network namespace (network_mode:
    # service:mainnetwork), so the backend is reachable at localhost rather
    # than via the "backend" Service DNS used in K8s. Rewrite the upstream to
    # localhost before launching nginx so the basic.sh smoke test can pass.
    command: ["sh", "-c", "sed -i 's|http://backend:8000|http://localhost:8000|g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    depends_on:
      - backend
    network_mode: service:mainnetwork
    volumes:
      - ./frontend:/app:delegated
    working_dir: /app
    environment:
      - APP_NAME=akvo-mis
      - APP_SHORT_NAME=akvo-mis
  mainnetwork:
    image: alpine:3.14
    command: ["tail", "-f", "/dev/null"]
    ports:
      - 8000:8000
volumes:
  pg-data: {}
