---
version: "3.9"
services:
  mainnetwork:
    ports:
      - 8081:8081
      - 19000:19000
  mobileapp:
    image: akvo/akvo-node-20-alpine:20250923.063900.7ce4b53
    command: ["./start.sh"]
    volumes:
      - akvo-mis-mobile-docker-sync:/app/node_modules:nocopy
      - ./app:/app:delegated
      - ./.git:/app/.git:ro
    working_dir: /app
    environment:
      - APK_NAME=${APK_NAME}
      - APK_SHORT_NAME=${APK_SHORT_NAME}
      - BACKEND_IP_ADDRESS=${IP_ADDRESS}
      # Expo runs inside this container but is reached from a physical device on
      # the LAN, so Metro must advertise the host's LAN IP in the manifest/bundle
      # URLs instead of the container-internal 127.0.0.1. Empty is fine when only
      # using a local emulator.
      - REACT_NATIVE_PACKAGER_HOSTNAME=${EXPO_HOST}
      # This app configures EAS Update (updates.url + runtimeVersion), so by
      # default `expo start` serves a signed update manifest that requires an
      # Expo account / EXPO_TOKEN. For local Expo Go development we have no
      # token, so run offline: Expo serves a plain local manifest from Metro and
      # the device loads the dev bundle directly instead of a remote update.
      - EXPO_OFFLINE=1
      - EXPO_TOKEN
      - SENTRY_ENV=${SENTRY_MOBILE_ENV}
      - SENTRY_DSN=${SENTRY_MOBILE_DSN}
      - SENTRY_AUTH_TOKEN=${SENTRY_MOBILE_AUTH_TOKEN}
      - WEBDOMAIN=${WEBDOMAIN}
    network_mode: service:mainnetwork
volumes:
  akvo-mis-mobile-docker-sync:
    external: true
