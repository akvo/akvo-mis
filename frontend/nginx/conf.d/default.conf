client_max_body_size    20M;
gzip                    on;
gzip_comp_level         5;
gzip_min_length         256;
gzip_proxied            any;
gzip_vary               on;
gzip_types
    application/javascript
    application/json
    application/x-font-ttf
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/css
    text/plain;

proxy_cache_path    /var/tmp/cache levels=1:2 keys_zone=STATIC:10m inactive=24h;

# The default key, $scheme$proxy_host$uri$is_args$args, does not identify
# the host the browser asked for: $proxy_host is `backend:8000` for every
# request, so every workspace subdomain and the base domain collapse into
# one entry. Under host-based tenant routing the backend's answer depends
# on the Host header, so one response cached for one host was being
# replayed to all the others.
proxy_cache_key     "$scheme$host$request_uri";

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    client_max_body_size 50M;

    if ($http_x_forwarded_proto = "http") {
       return 301 https://$host$request_uri;
    }

    location /api {
        rewrite                 ^/api/(.*) /api/$1 break;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_pass              http://backend:8000;
    }

    location /app {
        try_files               /storage/apk/unicef-fsm-mobile.apk =404;
        add_header              Content-Disposition 'attachment; filename="unicef-fsm-mobile.apk"';
        add_header              Cache-Control 'no-store';
    }

    location /config.js {
        rewrite                 ^/config.js /api/v1/config.js break;
        add_header              Cache-Control "max-age=1800, public";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_ignore_headers    X-Accel-Expires Expires Cache-Control Set-Cookie;
        proxy_buffering         on;
        proxy_cache             STATIC;
        proxy_cache_valid       200 206 1d;
        # Deliberately no `proxy_cache_valid any`: this is the script that
        # boots the whole app, and index.html has no fallback if it comes
        # back as anything else. Caching a failure for an hour turns one
        # bad response into an hour of blank pages.
        proxy_cache_use_stale   error timeout invalid_header updating
                                http_500 http_502 http_503 http_504;
        proxy_pass              http://backend:8000;
    }

    location /static-files {
        proxy_set_header        Host $host;
        add_header              Cache-Control "max-age=1800, public";
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_ignore_headers    X-Accel-Expires Expires Cache-Control Set-Cookie;

        proxy_buffering         on;
        proxy_cache             STATIC;
        proxy_cache_valid       200 206 1d;
        proxy_cache_valid       any 60m;
        proxy_cache_use_stale   error timeout invalid_header updating
                                http_500 http_502 http_503 http_504;
        proxy_pass              http://backend:8000;
    }

    location /images/ {
        rewrite ^/images/(.*)$ /storage/images/$1 last;
        expires                 7d;
        add_header              Cache-Control "max-age=604800, public";
    }

    location /attachments/ {
        rewrite ^/attachments/(.*)$ /storage/attachments/$1 last;
        expires                 7d;
        add_header              Cache-Control "max-age=604800, public";
    }

    location /batch-attachments/ {
        rewrite ^/batch-attachments/(.*)$ /storage/batch_attachments/$1 last;
        expires                 7d;
        add_header              Cache-Control "max-age=604800, public";
    }

    location /cronjob_results/ {
        rewrite ^/cronjob_results/(.*)$ /storage/cronjob_results/$1 last;
    }

    location /datapoints/ {
        rewrite ^/datapoints/(.*)$ /storage/datapoints/$1 last;
    }

    location /fiji-administration.csv {
        rewrite ^/fiji-administration.csv  /storage/master_data/fiji-administration.csv break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

}
