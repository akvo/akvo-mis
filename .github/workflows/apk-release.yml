name: MOHHS MIS APK build

on:
  workflow_dispatch:
  push:
    branches:
      - tenant/mohhs-mis
    paths:
      - app/**

jobs:
  release:
    name: apk build
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️  Checkout repository
        uses: actions/checkout@v3

      - name: 🧰 Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: 🏗  Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          cd ./app/
          cp ./src/build.testing.js ./src/build.js
          sed -i "s|http://localhost:3000|https://${APP_DOMAIN}.akvotest.org|" ./src/build.js
          sed -i "s|apkURL: ''|apkURL: 'https://${APP_DOMAIN}.akvotest.org/app'|" ./src/build.js
          npm install --legacy-peer-deps

      - name: 🚀 Release to Expo Dev
        id: eas_release
        working-directory: ./app
        run: |
          npm run eas-cli:release > output.txt
          cat output.txt
          echo "APK_URL=$(tail -n 1 output.txt)" >> $GITHUB_ENV

      - name: Set short git commit SHA
        id: vars
        run: |
          shortSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$shortSha" >> $GITHUB_ENV

      - name: Get App Version
        id: get_version
        run: |
          cd app
          apk_version=$(grep '"version":' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "APK_VERSION=$apk_version" >> $GITHUB_ENV

      - name: 🌟 Send APK
        env:
          APK_VERSION: ${{ env.APK_VERSION }}
          SECRET: ${{ secrets.MOHHS_MIS_APK_UPLOAD_SECRET }}
          SENTRY_ENV: production
          SENTRY_DSN: ${{ secrets.MOHHS_MIS_SENTRY_MOBILE_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_MOBILE_AUTH_TOKEN }}
          APP_DOMAIN: mohhs-mis
        run: |
          curl -X 'POST' \
            "https://${APP_DOMAIN}.akvotest.org/api/v1/device/apk/upload" \
            -H 'accept: */*' \
            -H 'Content-Type: application/json' \
            -d '{
              "apk_url": "'"$APK_URL"'",
              "apk_version": "'"$APK_VERSION"'",
              "secret": "'"$SECRET"'"
            }'
