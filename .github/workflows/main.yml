name: Akvo MIS CI

on:
  push:
  pull_request:
    types: [synchronize]

# Concurrency split by ref:
#  - main: one shared lane ("akvo-mis-test-deploy") so test-cluster deploys run
#    serially (no overlapping deploys).
#  - any other ref (branches, PRs, and each event): a unique per-run group, so
#    runs never queue behind each other and every push is validated (nothing is
#    dropped by the "only one pending per group" rule).
# Note: cancel-in-progress: false keeps the in-progress run alive; it does NOT
# protect a *pending* run — GitHub keeps only the newest pending per group, which
# is exactly why a shared/constant group cancelled runs before.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'akvo-mis-test-deploy' || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  build_and_deploy_jobs:
    name: Akvo MIS Build and Deploy Jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GKE auth plugin
        uses: ./.github/actions/install-google-cloud-sdk

      - name: Set short git commit SHA
        id: vars
        run: |
          shortSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$shortSha" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create credentials folder
        run: mkdir -p "/home/runner/work/${{ secrets.APP_SHORT_NAME }}/credentials"
        shell: bash

      - name: Write gcp deployment secret to file
        run: |
          echo "${{ secrets.GCLOUD_SERVICE_ACCOUNT }}" | base64 --decode > "/home/runner/work/${{ secrets.APP_SHORT_NAME }}/credentials/gcp.json"
        shell: bash

      # Without a base, changed-files diffs only the commits in the current
      # push. A branch whose latest push happens to be frontend-only then
      # reports no backend changes even when the branch as a whole rewrites
      # the API, so ci/build.sh skips the backend build and the coverage
      # status the ruleset requires is never posted at all. Diff against the
      # point the branch left main instead, so the answer describes the
      # branch rather than the last thing pushed to it.
      - name: Resolve the diff base
        id: diff-base
        env:
          # Through the environment, not interpolated into the script: a ref
          # name is attacker-supplied text.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" || "${REF_NAME}" == "develop" ]]; then
            # ci/build.sh already forces a full build on these, and a branch
            # has no fork point with itself. Leave the base empty so
            # changed-files keeps its own default.
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --quiet origin "${DEFAULT_BRANCH}"
            echo "sha=$(git merge-base FETCH_HEAD HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          base_sha: ${{ steps.diff-base.outputs.sha }}

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in "$ALL_CHANGED_FILES"; do
            echo "$file was changed"
          done

      - name: Detect event type
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
              echo "PULL_REQUEST_EVENT=true" >> $GITHUB_ENV
          else
              echo "PULL_REQUEST_EVENT=false" >> $GITHUB_ENV
          fi

      - name: Build and test
        env:
          APP_SHORT_NAME: ${{ secrets.APP_SHORT_NAME }}
          CI_COMMIT: ${{ env.COMMIT_SHORT_SHA }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_TAG: ""
          CI_PULL_REQUEST: ${{ env.PULL_REQUEST_EVENT }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
          COMPOSE_INTERACTIVE_NO_CLI: 1
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_AKVO_MIS_TOKEN }}
          DBDOCS_TOKEN: ${{ secrets.DBDOCS_TOKEN }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          REACT_APP_CARTO_API_KEY: ${{ secrets.REACT_APP_CARTO_API_KEY }}
        run: |
          export SERVICE_ACCOUNT="/home/runner/work/${{ secrets.APP_SHORT_NAME }}/credentials"
          ./ci/build.sh

      - name: Deploy
        env:
          APP_SHORT_NAME: ${{ secrets.APP_SHORT_NAME }}
          CI_COMMIT: ${{ env.COMMIT_SHORT_SHA }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_TAG: ""
          CI_PULL_REQUEST: ${{ env.PULL_REQUEST_EVENT }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
          COMPOSE_INTERACTIVE_NO_CLI: 1
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          export SERVICE_ACCOUNT="/home/runner/work/${{ secrets.APP_SHORT_NAME }}/credentials"
          ./ci/deploy.sh
