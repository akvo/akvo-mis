---
version: "3.9"
services:
  mainnetwork:
    image: alpine:3.14
    command: ["tail", "-f", "/dev/null"]
    ports:
      - 3000:3000
      - 8000:8000
      - 5050:5050
      # backend debuger port
      - 8888:8888
  frontend:
    network_mode: service:mainnetwork
    volumes:
      - ${STORAGE_PATH}/images:/app/public/images:delegated
      - ${STORAGE_PATH}/attachments:/app/public/attachments:delegated
      - ${STORAGE_PATH}/batch_attachments:/app/public/batch_attachments:delegated
      - ${STORAGE_PATH}/datapoints:/app/public/datapoints:delegated
      - ${STORAGE_PATH}/apk:/app/public/apk:delegated
      - ${STORAGE_PATH}/master_data:/app/public/master_data:delegated
      - ${STORAGE_PATH}/cronjob_results:/app/public/cronjob_results:delegated
    environment:
      - APP_NAME=$APP_NAME
      - APP_SHORT_NAME=$APP_SHORT_NAME
      - REACT_APP_CARTO_API_KEY=$REACT_APP_CARTO_API_KEY
  # Local mail sink. Deliberately NOT in mainnetwork's namespace: the worker
  # sends mail too and is on the default network, so a service with its own
  # name is reachable from both, the way db already is.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      # Web inbox. SMTP (1025) stays internal — nothing on the host sends.
      - 8025:8025
    environment:
      - MP_MAX_MESSAGES=500
      # A dev sink authenticates nobody; without these it rejects the
      # unauthenticated, unencrypted send Django makes by default.
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
  worker:
    volumes:
      - ../akvo-config/k8s-secrets/test/$APP_SHORT_NAME:/credentials/:ro
      - ${STORAGE_PATH}:/app/storage:delegated
    environment:
      - APP_NAME=$APP_NAME
      - APP_SHORT_NAME=$APP_SHORT_NAME
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/${APP_SHORT_NAME:-akvo-mis}-service-account.json
      - MAILJET_APIKEY=$MAILJET_APIKEY
      - MAILJET_SECRET=$MAILJET_SECRET
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - WEBDOMAIN=http://localhost:3000
    depends_on:
      - mailpit
  backend:
    volumes:
      - ../akvo-config/k8s-secrets/test/$APP_SHORT_NAME:/credentials/:ro
      - ${STORAGE_PATH}:/app/storage:delegated
    environment:
      - APP_NAME=$APP_NAME
      - APP_SHORT_NAME=$APP_SHORT_NAME
      - APK_SHORT_NAME=$APK_SHORT_NAME
      - APK_NAME=$APK_NAME
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/${APP_SHORT_NAME:-akvo-mis}-service-account.json
      - MAILJET_APIKEY=$MAILJET_APIKEY
      - MAILJET_SECRET=$MAILJET_SECRET
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      # Activation and invite links are built from this, so it has to be the
      # address the browser uses. env.example ships example.com, which made
      # backend-sent links unclickable while worker-sent ones worked — the
      # worker has always pinned localhost here.
      - WEBDOMAIN=http://localhost:3000
      # Unbuffered stdout: send_email swallows failures into a bare print(),
      # which otherwise sits in the buffer and never reaches docker logs.
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - OPENAI_ASSISTANT_ID=$OPENAI_ASSISTANT_ID
      - OPENAI_VECTOR_STORE_ID=$OPENAI_VECTOR_STORE_ID
    network_mode: service:mainnetwork
    depends_on:
      - mailpit
  pgadmin:
    image: dpage/pgadmin4:5.7
    environment:
      - PGADMIN_LISTEN_PORT=5050
      - PGADMIN_DEFAULT_EMAIL=dev@akvo.org
      - PGADMIN_DEFAULT_PASSWORD=password
    volumes:
      - ./pgadmin4/servers.json:/pgadmin4/servers.json
      - pg-admin-data:/var/lib/pgadmin
    depends_on:
      - db
    network_mode: service:mainnetwork
volumes:
  pg-admin-data:
